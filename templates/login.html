<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;

            background: #ffffff;

            padding: 35px;

            border-radius: 12px;

            border-top: 5px solid #b8c9dc;

            box-shadow: 0 5px 20px rgba(80, 100, 120, 0.10);
        }

        h2 {
            text-align: center;

            color: #40566d;

            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            color: #52677b;

            font-size: 14px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-top: 7px;
            margin-bottom: 18px;

            border: 1px solid #c9d6e4;

            border-radius: 7px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #9fb2c5;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #dce6f1;

            color: #40566d;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #cdd9e6;
        }

        .error {
            background: #f8e4e4;

            color: #8a5555;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Manager Login</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
